<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's meet up</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1a1a1a; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #f0f0f0; --muted: #999; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin-top: 0; }
    .muted { color: var(--muted); }
    button { font: inherit; padding: .5rem 1rem; }
    .small { font-size: .85rem; }
    #where input { width: 100%; box-sizing: border-box; font: inherit; padding: .6rem .75rem; }
    #results { list-style: none; margin: .25rem 0 .75rem; padding: 0; }
    #results button { display: block; width: 100%; text-align: left; margin-top: .25rem; }
    #snapped { font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Let's meet up</h1>
    <p class="muted">Find a London spot that works for everyone.</p>
    <div id="signin"></div>
    <div id="me" hidden>
      <p>Signed in as <strong id="name"></strong></p>
      <button id="logout" type="button">Sign out</button>
    </div>
    <p id="error" class="muted" role="alert"></p>

    <section id="where">
      <h2>Where are you travelling from?</h2>
      <p class="muted">Preview, nothing is saved yet. Your exact location stays on your device; only the neighbourhood is used.</p>
      <input id="q" type="search" placeholder="Area or postcode, e.g. Hoxton or E8" autocomplete="off" aria-label="Area or postcode">
      <ul id="results"></ul>
      <button id="locate" type="button">Use my location</button>
      <p id="snapped" role="status"></p>
    </section>
    <p class="muted small">Neighbourhood list &copy; OpenStreetMap contributors (ODbL).</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const HEADERS = { 'Content-Type': 'application/json', 'X-Requested-With': 'letsmeetup' };

    function showUser(user) {
      $('signin').hidden = !!user;
      $('me').hidden = !user;
      if (user) $('name').textContent = user.name; // textContent: names are user-controlled
    }

    async function api(path, options) {
      const res = await fetch(path, { credentials: 'same-origin', ...options });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      return res.json();
    }

    async function onCredential(response) {
      try {
        $('error').textContent = '';
        const { user } = await api('/api/auth/google', {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify({ credential: response.credential }),
        });
        showUser(user);
      } catch (e) {
        $('error').textContent = 'Sign-in failed. Please try again.';
      }
    }

    $('logout').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST', headers: HEADERS });
      showUser(null);
    });

    async function init() {
      const [{ googleClientId }, { user }] = await Promise.all([api('/api/config'), api('/api/me')]);
      showUser(user);
      const waitForGsi = setInterval(() => {
        if (!window.google || !google.accounts) return;
        clearInterval(waitForGsi);
        google.accounts.id.initialize({ client_id: googleClientId, callback: onCredential });
        google.accounts.id.renderButton($('signin'), { theme: 'outline', size: 'large' });
      }, 100);
    }
    init().catch(() => { $('error').textContent = 'Could not load. Please refresh.'; });
  </script>

  <script type="module">
    import { loadAreas, searchAreas, snapToArea, looksLikePostcode, lookupPostcode, getCurrentPosition } from '/snap.js';

    const $ = (id) => document.getElementById(id);
    let areas = [];
    // The only thing that would ever be sent to the server is chosen.area.id.
    let chosen = null;

    function choose(area, note) {
      chosen = area;
      $('results').replaceChildren();
      $('snapped').textContent = `You're in ${area.name}${note ? ` (${note})` : ''}`; // textContent, never innerHTML
    }

    function showMatches(matches) {
      const ul = $('results');
      ul.replaceChildren(...matches.map((a) => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = a.name;
        b.addEventListener('click', () => choose(a));
        li.append(b);
        return li;
      }));
    }

    async function snapFromPoint(point, label) {
      const hit = snapToArea(point.lat, point.lng, areas);
      if (!hit) { $('snapped').textContent = "That's outside the area we cover (Greater London)."; return; }
      choose(hit.area, label);
    }

    $('q').addEventListener('input', () => {
      $('snapped').textContent = '';
      showMatches(searchAreas($('q').value, areas));
    });

    $('q').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const text = $('q').value.trim();
      if (!looksLikePostcode(text)) return;
      const point = await lookupPostcode(text).catch(() => null);
      if (!point) { $('snapped').textContent = "Couldn't find that postcode."; return; }
      await snapFromPoint(point, 'from your postcode');
    });

    $('locate').addEventListener('click', async () => {
      try {
        $('snapped').textContent = 'Locating…';
        await snapFromPoint(await getCurrentPosition(), 'from your location');
      } catch (e) {
        $('snapped').textContent = e.message;
      }
    });

    loadAreas().then((a) => { areas = a; }).catch(() => { $('snapped').textContent = 'Could not load areas. Please refresh.'; });
  </script>
</body>
</html>
