<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diarmuid's Site</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    body {
      position: relative;
      margin: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("assets/gang.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.1;
      z-index: -1;
    }
    #bookclub-banner {
      display: inline-block;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      font-weight: bold;
      text-decoration: none;
      color: #d1004a;
      background: #ffe3ee;
      border: 2px solid #d1004a;
      border-radius: 6px;
      padding: 6px 14px;
      transition: top 4s ease-in-out, left 4s ease-in-out;
    }
    #location-controls { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #location-controls button.active { font-weight: bold; background: #3388ff; color: #fff; }
    #location-scrub { flex: 1 1 200px; min-width: 120px; }
    .loc-now { width: 18px; height: 18px; border-radius: 50%; background: #d1004a; border: 2px solid #fff; box-shadow: 0 0 0 0 rgba(209, 0, 74, 0.7); animation: loc-pulse 1.8s infinite; }
    @keyframes loc-pulse {
      70% { box-shadow: 0 0 0 14px rgba(209, 0, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(209, 0, 74, 0); }
    }
  </style>
</head>
<body>
  <a id="bookclub-banner" href="/bookclub">NEW: bookclub</a>
  <h1>What up, this my site</h1>

  <section id="heat-of-the-week">
    <h2>Heat of the Month</h2>
    <p>This is where you can catch the heat of the month.</p>
    <button id="music-toggle">▶ Play music</button>
    <audio id="bg-music" src="assets/HOTW 1.mp3" loop></audio>
  </section>

  <section id="top-songs">
    <h2>Top Songs (last 7 days)</h2>
    <ol id="top-songs-list"><li>Loading...</li></ol>
  </section>

  <section id="location">
    <h2>Locations</h2>
    <div id="location-controls" hidden>
      <button type="button" data-range="24">24h</button>
      <button type="button" data-range="168">7d</button>
      <button type="button" data-range="720">30d</button>
      <button type="button" data-range="all" class="active">All</button>
      <button type="button" id="location-play">▶ Play</button>
      <input type="range" id="location-scrub" min="1" max="1" value="1" aria-label="Show points up to">
    </div>
    <div id="location-map" style="height: 300px;"></div>
    <p id="location-status">Loading...</p>
  </section>

  <section id="comments">
    <h2>Comments - Check in below, say what's up, hang out</h2>
    <form id="comment-form">
      <input type="text" id="comment-name" placeholder="Your name" required maxlength="50">
      <textarea id="comment-text" placeholder="Say something..." required maxlength="500"></textarea>
      <button type="submit">Post</button>
    </form>
    <div id="comment-list"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const LOCATION_API_URL =
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:8787/api/location'
        : 'https://diarmuid-location-api.diarmuidcoffey99.workers.dev/api/location';

    async function renderLocation() {
      const status = document.getElementById('location-status');
      try {
        const res = await fetch(LOCATION_API_URL);
        const points = await res.json();
        if (!points || points.length === 0) {
          status.textContent = 'No location received yet.';
          return;
        }

        // D1 CURRENT_TIMESTAMP looks like "YYYY-MM-DD HH:MM:SS" (UTC, no zone); treat it as UTC.
        const parseTime = ts => {
          const s = String(ts);
          return new Date(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s) ? s.replace(' ', 'T') + 'Z' : s);
        };
        for (const p of points) {
          p.time = parseTime(p.timestamp);
          p.when = p.time.toLocaleString();
        }
        points.sort((a, b) => a.time - b.time);

        const map = L.map('location-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);

        const controls = document.getElementById('location-controls');
        const scrub = document.getElementById('location-scrub');
        const playBtn = document.getElementById('location-play');
        controls.hidden = false;

        let inRange = [];       // points inside the chosen date range
        let playTimer = null;

        const ageColor = f => `hsl(${Math.round(210 - 190 * f)}, 85%, 50%)`; // blue (old) -> red (new)

        function stopPlay() {
          clearInterval(playTimer);
          playTimer = null;
          playBtn.textContent = '▶ Play';
        }

        function draw() {
          layer.clearLayers();
          const shown = inRange.slice(0, Number(scrub.value));
          if (shown.length === 0) {
            status.textContent = 'No points in this range.';
            return;
          }
          const last = shown.length - 1;
          const frac = i => (last === 0 ? 1 : i / last);

          for (let i = 1; i < shown.length; i++) {
            const f = frac(i);
            L.polyline([[shown[i - 1].lat, shown[i - 1].long], [shown[i].lat, shown[i].long]], {
              color: ageColor(f), opacity: 0.25 + 0.75 * f, weight: 3,
            }).addTo(layer);
          }
          shown.forEach((p, i) => {
            let m;
            if (i === last) {
              m = L.marker([p.lat, p.long], {
                icon: L.divIcon({ className: '', html: '<div class="loc-now"></div>', iconSize: [18, 18] }),
                zIndexOffset: 1000,
              });
            } else {
              const f = frac(i);
              m = L.circleMarker([p.lat, p.long], {
                radius: 4, color: ageColor(f), fillColor: ageColor(f),
                fillOpacity: 0.25 + 0.75 * f, opacity: 0.25 + 0.75 * f, weight: 1,
              });
            }
            m.addTo(layer).bindPopup(p.when);
          });

          const p = shown[last];
          status.textContent = `${countLabel(shown.length, inRange.length)}. Latest shown: ${Number(p.lat).toFixed(4)}, ${Number(p.long).toFixed(4)} at ${p.when}`;
        }

        const countLabel = (n, total) => (n === total ? `${total} points` : `${n} of ${total} points`);

        function applyRange(hours, fit) {
          stopPlay();
          const cutoff = hours === 'all' ? -Infinity : Date.now() - hours * 3600 * 1000;
          inRange = points.filter(p => p.time.getTime() >= cutoff);
          scrub.max = Math.max(inRange.length, 1);
          scrub.value = scrub.max;
          draw();
          if (fit && inRange.length) {
            map.fitBounds(L.latLngBounds(inRange.map(p => [p.lat, p.long])), { maxZoom: 15, padding: [20, 20] });
          }
        }

        controls.querySelectorAll('button[data-range]').forEach(btn => {
          btn.addEventListener('click', () => {
            controls.querySelectorAll('button[data-range]').forEach(b => b.classList.toggle('active', b === btn));
            const r = btn.dataset.range;
            applyRange(r === 'all' ? 'all' : Number(r), true);
          });
        });

        scrub.addEventListener('input', () => { stopPlay(); draw(); });

        playBtn.addEventListener('click', () => {
          if (playTimer) { stopPlay(); return; }
          if (inRange.length < 2) return;
          if (Number(scrub.value) >= Number(scrub.max)) scrub.value = 1;
          playBtn.textContent = '⏸ Pause';
          const step = Math.max(1, Math.ceil(inRange.length / 100)); // roughly 10s end to end
          playTimer = setInterval(() => {
            scrub.value = Math.min(Number(scrub.max), Number(scrub.value) + step);
            draw();
            if (Number(scrub.value) >= Number(scrub.max)) stopPlay();
          }, 100);
        });

        const latest = points[points.length - 1];
        map.setView([latest.lat, latest.long], 13); // must be set before layers are added
        applyRange('all', false);
      } catch (e) {
        status.textContent = "Couldn't load location.";
      }
    }
    renderLocation();
  </script>

  <script>
    const bookclubBanner = document.getElementById('bookclub-banner');

    function moveBookclubBanner() {
      const maxLeft = Math.max(0, window.innerWidth - bookclubBanner.offsetWidth - 10);
      const maxTop = Math.max(0, window.innerHeight - bookclubBanner.offsetHeight - 10);
      bookclubBanner.style.left = `${10 + Math.random() * maxLeft}px`;
      bookclubBanner.style.top = `${10 + Math.random() * maxTop}px`;
    }

    moveBookclubBanner();
    setInterval(moveBookclubBanner, 5000);
  </script>

  <script>
    async function checkForNewVersion() {
      try {
        const res = await fetch('/version.json?_=' + Date.now(), { cache: 'no-store' });
        const { version } = await res.json();
        const seen = localStorage.getItem('siteVersion');
        localStorage.setItem('siteVersion', version);
        if (seen && seen !== version) {
          location.href = location.pathname + '?v=' + version;
          return;
        }
      } catch (e) {
        // offline or fetch blocked — nothing to do
      }
    }
    checkForNewVersion();
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) checkForNewVersion();
    });
  </script>

  <script>
    const music = document.getElementById('bg-music');
    const toggle = document.getElementById('music-toggle');

    toggle.addEventListener('click', () => {
      if (music.paused) {
        music.play();
        toggle.textContent = '⏸ Pause music';
      } else {
        music.pause();
        toggle.textContent = '▶ Play music';
      }
    });
  </script>

  <script>
    const LASTFM_API_KEY = 'd38c7bd2ac7c70ddd3accb62ffdfdfdb';
    const LASTFM_USERNAME = 'diarmuidcoffey';
    const LASTFM_DAYS = 7;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    async function fetchRecentTracks(apiKey, fromTs) {
      const tracks = [];
      let page = 1;
      let totalPages = 1;

      while (page <= totalPages) {
        const params = new URLSearchParams({
          method: 'user.getrecenttracks',
          user: LASTFM_USERNAME,
          api_key: apiKey,
          format: 'json',
          from: fromTs,
          limit: 200,
          page: page,
        });

        const response = await fetch(`https://ws.audioscrobbler.com/2.0/?${params}`);
        const data = await response.json();

        if (data.error) {
          throw new Error(`Last.fm API error ${data.error}: ${data.message || 'no message provided'}`);
        }

        const recent = data.recenttracks;
        totalPages = parseInt(recent['@attr'].totalPages, 10);

        for (const track of recent.track) {
          if (track['@attr'] && track['@attr'].nowplaying === 'true') continue;
          const images = Object.fromEntries((track.image || []).map(img => [img.size, img['#text']]));
          tracks.push({
            artist: track.artist['#text'],
            track: track.name,
            imageUrl: images.extralarge || '',
          });
        }

        page += 1;
      }

      return tracks;
    }

    function topSongs(tracks, n = 5) {
      const counts = new Map();
      const images = new Map();

      for (const t of tracks) {
        const key = `${t.artist}|||${t.track}`;
        counts.set(key, (counts.get(key) || 0) + 1);
        images.set(key, t.imageUrl);
      }

      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, n)
        .map(([key, count]) => {
          const [artist, track] = key.split('|||');
          return { artist, track, count, imageUrl: images.get(key) };
        });
    }

    async function renderTopSongs() {
      const list = document.getElementById('top-songs-list');
      try {
        const fromTs = Math.floor(Date.now() / 1000) - LASTFM_DAYS * 24 * 60 * 60;
        const tracks = await fetchRecentTracks(LASTFM_API_KEY, fromTs);
        const top = topSongs(tracks, 5);

        list.innerHTML = '';
        for (const { artist, track, count, imageUrl } of top) {
          const li = document.createElement('li');
          li.innerHTML = `
            ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="" width="40" height="40" style="vertical-align:middle;margin-right:8px;">` : ''}
            <strong>${escapeHtml(artist)}</strong> - ${escapeHtml(track)} (${count} plays)
          `;
          list.appendChild(li);
        }
      } catch (e) {
        list.innerHTML = `<li>Couldn't load top songs: ${escapeHtml(e.message)}</li>`;
      }
    }

    renderTopSongs();
  </script>

      authDomain: "diarmuid-webpage.firebaseapp.com",
      projectId: "diarmuid-webpage",
      storageBucket: "diarmuid-webpage.firebasestorage.app",
      messagingSenderId: "234273109755",
      appId: "1:234273109755:web:45996e94fdca4ad520225e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const commentForm = document.getElementById('comment-form');
    const nameInput = document.getElementById('comment-name');
    const textInput = document.getElementById('comment-text');
    const commentList = document.getElementById('comment-list');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML.replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    commentForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const text = textInput.value.trim();
      if (!name || !text) return;

      db.collection('comments').add({
        name,
        text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      commentForm.reset();
    });

    db.collection('comments').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
      commentList.innerHTML = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        const when = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'just now';
        const entry = document.createElement('div');
        entry.className = 'comment';
        entry.innerHTML = `<strong>${escapeHtml(data.name)}</strong> ${escapeHtml(data.text)} <small>${when}</small>`;
        commentList.appendChild(entry);
      });
    });
  </script>
