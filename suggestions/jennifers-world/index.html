<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jennifer's world 🐰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="/suggestions/">← back</a>
  <h1>🐰 Jennifer's world 💋</h1>
  <p class="sub">Bunnies and drims are raining down. Tap them for Jennifer to kiss!</p>

  <div id="sky" aria-label="Bunnies and pictures of drim raining down around Jennifer">
    <div id="jennifer" aria-hidden="true">👩<span id="kiss"></span></div>
  </div>

  <p class="score">Kisses: <strong id="count">0</strong></p>

  <div class="controls">
    <label class="photo">Add your own drim pictures
      <input id="photos" type="file" accept="image/*" multiple>
    </label>
    <button id="clear" type="button" hidden>Reset pictures</button>
  </div>
  <p class="note">Pictures you pick stay in your browser for this visit only. Nothing is uploaded, saved or shared.</p>

  <script src="script.js"></script>
</body>
</html>
